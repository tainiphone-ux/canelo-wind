<!doctype html>

<style>
:root {
  --bg: #F6F1EA; --card: #FFFFFF; --text: #2A1E16; --muted: #7A6A5E; --line: #E7DDD1;
  --brand: #B85A22; --brand2: #9A4416; --chip: #EFE4D7; --good: #1E8E4E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120E; --card: #231B15; --text: #F4EAE0; --muted: #B2A193; --line: #3A2E25;
    --brand: #E08A3C; --brand2: #F0A564; --chip: #33281F; --good: #4CC383;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--brand); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(135deg, #E08A3C, #9A4416); color: #fff; position: sticky; top: 0; z-index: 5; }
header img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
header small { display: block; opacity: .85; font-size: 12px; }
header .der { margin-left: auto; display: flex; gap: 6px; }
header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 600; cursor: pointer; }
@media (max-width: 480px) {
  header { gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
  header h1 { font-size: 18px; white-space: nowrap; }
  header small { display: none; }
  header button { padding: 6px 8px; font-size: 13px; }
  #btnSugerir .txt { display: none; }
}
main { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
.buscar { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { border: 0; background: var(--chip); color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--brand); color: #fff; }
h2.isla { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }
.lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.spot { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.spot:hover { border-color: var(--brand); }
.spot .info { flex: 1; min-width: 0; }
.spot b { display: block; }
.spot .sub { color: var(--muted); font-size: 12px; }
.badge { min-width: 62px; text-align: center; border-radius: 10px; padding: 6px 4px; font-weight: 700; color: #1b1b1b; }
.badge small { display: block; font-weight: 500; font-size: 11px; }
.fav { background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0 2px; }
.fav.on { color: #F2B100; }
.acciones-spot { display: flex; align-items: center; gap: 6px; }
.compartir { border: 0; background: var(--brand); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 12px rgba(154,68,22,.25); }
.compartir:active { transform: scale(.96); }
.aviso-copiado { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2A1E16; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.flecha { display: inline-block; transition: transform .2s; }
/* Ficha del spot */
.volver { background: none; border: 0; color: var(--brand); font-size: 15px; cursor: pointer; padding: 0; margin-bottom: 8px; }
.cab { display: flex; align-items: flex-start; gap: 10px; }
.cab h2 { margin: 0; font-size: 24px; }
.etq { display: inline-block; background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 12px; margin: 4px 4px 0 0; }
.caja { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
.caja h3 { margin: 0 0 10px; font-size: 16px; }
.ahora { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.dato { background: var(--chip); border-radius: 10px; padding: 10px; }
.dato .n { font-size: 26px; font-weight: 800; }
.dato .t { font-size: 12px; color: var(--muted); }
.dias { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.dia { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 10px; cursor: pointer; text-align: center; min-width: 74px; }
.dia.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.dia .d { font-weight: 700; font-size: 13px; text-transform: capitalize; }
.dia .m { font-size: 12px; border-radius: 6px; margin-top: 4px; padding: 1px 4px; color: #1b1b1b; font-weight: 700; }
.tabla { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
td.v { font-weight: 700; color: #1b1b1b; border-radius: 4px; }
tr.ok td.dir { color: var(--good); font-weight: 700; }
.grafica svg { width: 100%; height: 160px; display: block; }
.enlaces a { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin: 6px 0; background: var(--chip); border-radius: 10px; text-decoration: none; color: var(--text); }
.enlaces a:hover { outline: 1px solid var(--brand); }
.enlaces a span { margin-left: auto; color: var(--muted); }
.aviso { color: var(--muted); font-size: 12px; margin-top: 8px; }
.cargando { color: var(--muted); padding: 20px 0; text-align: center; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; font-size: 11px; }
.leyenda span { padding: 2px 6px; border-radius: 4px; color: #1b1b1b; }
label.noche { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.fila { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
/* Formularios: reportes y sugerencias */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.form label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.form input, .form select, .form textarea { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.form .ancho { grid-column: 1 / -1; }
.estrellas { display: flex; gap: 2px; }
.estrellas button { background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--line); padding: 0; }
.estrellas button.on { color: #F2B100; }
.btn { border: 0; background: var(--brand); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; }
.btn.sec { background: var(--chip); color: var(--text); }
.msg { margin-top: 10px; padding: 10px; border-radius: 8px; background: var(--chip); font-size: 14px; }
.reporte { border-top: 1px solid var(--line); padding: 10px 0; }
.reporte:first-child { border-top: 0; }
.reporte .cab2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.reporte .cab2 b { color: var(--text); }
.fondo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 20; overflow-y: auto; }
.fondo .caja { max-width: 520px; width: 100%; margin: 0; }
/* Quedadas (downwinds y sesiones) */
.banner-q { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; border: 0; border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left;
  background: linear-gradient(135deg, #2F7FB0, #1B5378); color: #fff; font: inherit; box-shadow: 0 4px 14px rgba(27,83,120,.25); }
.banner-q b { font-size: 16px; display: block; }
.banner-q small { opacity: .9; font-size: 12px; }
.banner-q .ir { margin-left: auto; font-size: 22px; }
.quedada { border-top: 1px solid var(--line); padding: 12px 0; }
.quedada:first-of-type { border-top: 0; }
.quedada .cuando { font-weight: 800; font-size: 16px; }
.quedada .cuando::first-letter { text-transform: uppercase; }
.quedada .ruta { font-weight: 700; margin-top: 2px; }
.quedada .ruta a { text-decoration: none; }
.quedada .det { font-size: 14px; margin-top: 4px; }
.quedada .acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.tipo-q { display: inline-block; background: #DCEBF5; color: #1B5378; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; margin-right: 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tipo-q { background: #173247; color: #A9D3F0; } }
.btn.peq { padding: 6px 12px; font-size: 13px; }
/* Atajos de arriba: Quedadas · Compraventa · Mi spot */
.atajos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.atajo { border: 0; border-radius: 14px; padding: 10px; cursor: pointer; text-align: left; color: #fff; font: inherit; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.atajo span { font-size: 24px; line-height: 1.1; }
.atajo b { font-size: 14px; }
.atajo small { font-size: 11px; opacity: .92; line-height: 1.2; }
.atajo.q { background: linear-gradient(135deg, #2F7FB0, #1B5378); }
.atajo.v { background: linear-gradient(135deg, #3AA169, #1E7247); }
.atajo.m { background: linear-gradient(135deg, #E08A3C, #B85A22); }
/* Compraventa */
.lista-v { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.anuncio { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; position: relative; }
.anuncio:hover { border-color: var(--brand); }
.anuncio .foto { aspect-ratio: 1 / 1; background: var(--chip) center / cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.anuncio .txt { padding: 8px 10px 10px; }
.anuncio .precio { font-size: 18px; font-weight: 800; }
.anuncio .precio small { font-size: 11px; font-weight: 600; color: var(--muted); }
.anuncio b { display: block; font-size: 14px; line-height: 1.25; margin-top: 2px; }
.anuncio .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.anuncio .tuyo { position: absolute; top: 8px; left: 8px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.foto-grande { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; border-radius: 12px; display: block; }
.miniaturas { display: flex; gap: 6px; margin-top: 6px; }
.miniaturas img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
.miniaturas img.on { border-color: var(--brand); }
.fotos-form { display: flex; gap: 8px; flex-wrap: wrap; }
.fotos-form .f { position: relative; width: 76px; height: 76px; border-radius: 10px; background: var(--chip) center / cover; }
.fotos-form .f button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: #2A1E16; color: #fff; cursor: pointer; font-size: 12px; }
.fotos-form .mas { width: 76px; height: 76px; border-radius: 10px; border: 2px dashed var(--line); background: none; color: var(--muted); font-size: 26px; cursor: pointer; }
.btn.verde { background: #25A35A; }
/* Mis spots (privados) */
.banner-mio { background: linear-gradient(135deg, #E08A3C, #B85A22); box-shadow: 0 4px 14px rgba(154,68,22,.25); }
.mapa-mio { height: 260px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); }
.rosa { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; }
.rosa button, .rosa span { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.rosa button { border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; font: inherit; font-weight: 700; }
.rosa button.on { background: var(--good); border-color: var(--good); color: #fff; }
.rosa span { font-size: 22px; }
label.chip { display: inline-flex; align-items: center; }
/* Notas y avisos del día */
.nota { display: inline-block; color: #fff; font-weight: 800; border-radius: 8px; padding: 4px 10px; font-size: 15px; white-space: nowrap; }
.nota.peq { font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 700; }
.nota-ahora { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: -2px 0 12px; font-size: 14px; color: var(--muted); }
.nota-ahora .nota { font-size: 18px; padding: 6px 14px; }
.avisos-dia { margin: 10px 0; padding: 10px 14px; border-radius: 12px; background: #FFF4D6; color: #6B4A00; border: 1px solid #F2D58A; font-size: 14px; }
.avisos-dia ul { margin: 6px 0 0; padding-left: 20px; }
.avisos-dia li { margin-bottom: 4px; }
.avisos-dia.ok { background: #E6F5EC; color: #1E6B3F; border-color: #A8DDBC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avisos-dia { background: #3A2E10; color: #FFE1A0; border-color: #6B5520; }
  :root:not([data-theme="light"]) .avisos-dia.ok { background: #12301F; color: #A8E6C0; border-color: #2A6040; } }
/* Consejos y aviso de seguridad */
.seguridad { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #FDE8E6; color: #8A1F17; border: 1px solid #F3B4AD; font-size: 14px; }
.seguridad b { display: block; margin-bottom: 4px; font-size: 15px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seguridad { background: #3A1714; color: #FFC9C2; border-color: #6B2A23; } }
.consejos ul { margin: 0; padding-left: 20px; }
.consejos li { margin-bottom: 6px; }
/* Pantalla de elegir idioma */
.elige-idioma { text-align: center; }
.elige-idioma img { border-radius: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.elige-idioma h2 { margin: 8px 0 2px; }
.idiomas { display: grid; gap: 8px; margin-top: 12px; }
.idioma { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 12px; padding: 12px 16px; font-size: 17px; font-weight: 700; cursor: pointer; text-align: left; }
.idioma span { font-size: 26px; }
.idioma.on { border-color: var(--brand); box-shadow: inset 0 0 0 2px var(--brand); }
/* Visor de webs dentro de la app */
.visor { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.barra-visor { display: flex; gap: 8px; align-items: center; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
  background: linear-gradient(135deg, #E08A3C, #9A4416); }
.volver-visor { flex: 1; border: 0; background: #fff; color: #9A4416; font-weight: 800; font-size: 17px; padding: 12px; border-radius: 12px; cursor: pointer; }
.fuera-visor { color: #fff; text-decoration: none; font-size: 22px; padding: 8px 12px; background: rgba(255,255,255,.18); border-radius: 12px; }
.titulo-visor { padding: 6px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.visor iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>

<script>
// ---------- Utilidades ----------
const $ = (s) => document.querySelector(s);
const guardar = (k, v) => { try { localStorage.setItem("cw_" + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, d) => { try { const v = localStorage.getItem("cw_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

const UNIDADES = { kn: { get t() { return t("nudos"); }, c: "kn", f: 1 }, kmh: { t: "km/h", c: "km/h", f: 1.852 }, ms: { t: "m/s", c: "m/s", f: 0.5144 } };
let unidad = leer("unidad", "kn");
let favoritos = leer("favoritos", []);
let filtroRegion = leer("region", "Todas"), filtroIsla = "Todas", filtroDeporte = "Todos", textoBuscar = "";
const cache = {};
// Región (Canarias, Andalucía…) y hora local de cada spot
const regionDe = (s) => s.region || "Canarias";
const consejosDe = (s) => (typeof CONSEJOS !== "undefined" && CONSEJOS[s.id]) || { consejos: [], seguridad: "" };
// Textos del spot en el idioma elegido (si no hay traducción, en español)
const textosDe = (s) => {
  const es = consejosDe(s), tr = IDIOMA !== "es" && typeof TEXTOS_SPOTS !== "undefined" && TEXTOS_SPOTS[s.id] && TEXTOS_SPOTS[s.id][IDIOMA];
  return { nota: (tr && tr.nota) || s.nota, consejos: (tr && tr.consejos) || es.consejos, seguridad: tr ? tr.seguridad : es.seguridad };
};
const nombreRegion = (r) => t("reg_" + r);
const nombreNivel = (nv) => t("niv_" + nv);
const tzDe = (s) => s.tz || (regionDe(s) === "Canarias" ? "Atlantic/Canary" : "Europe/Madrid");

const rumbo = (g) => PUNTOS_IDIOMA[IDIOMA][Math.round(((g % 360) / 22.5)) % 16];
// Dirección "buena" del spot: N, NE, E... aceptamos ±30° alrededor
const GRADOS = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SO: 225, O: 270, NO: 315 };
const enDirecciones = (lista, g) => lista.some(d => Math.abs(((g - GRADOS[d]) + 540) % 360 - 180) <= 30);
const dirBuena = (spot, g) => enDirecciones(spot.buenos, g);

// ---------- Nota de cada hora: muy malo, malo, regular, bueno, muy bueno ----------
const NOTAS = ["#C8423B", "#E8793A", "#D9A520", "#5FA83A", "#16924F"];
const notaHtml = (n, peq) => `<span class="nota${peq ? " peq" : ""}" style="background:${NOTAS[n]}">${t("n" + n)}</span>`;
// w, g: viento y rachas (nudos) · d: dirección · ola: metros (o null) · codigo: tiempo (95+ = tormenta)
function evaluar(spot, w, g, d, ola, codigo) {
  const experto = /experto/i.test(spot.nivel), aprender = /iniciaci|todos/i.test(spot.nivel);
  const motivos = [];
  let n;
  if (w < 8) { n = 0; motivos.push(t("m_sin")); }
  else if (w < 11) { n = 1; motivos.push(t("m_flojo")); }
  else if (w < 14) { n = 2; motivos.push(t("m_justo")); }
  else if (w < 18) n = 3;
  else if (w <= (experto ? 38 : 28)) n = 4;
  else if (w <= (experto ? 45 : 34)) { n = 3; motivos.push(t("m_fuerte")); }
  else if (w <= (experto ? 50 : 40)) { n = 1; motivos.push(t("m_excesivo")); }
  else { n = 0; motivos.push(t("m_peligroso")); }
  const peligro = consejosDe(spot).peligro || [];
  if (w >= 6 && peligro.length && enDirecciones(peligro, d)) { n = 0; motivos.push(t("m_off")); }
  else if (w >= 8 && !dirBuena(spot, d)) { n = Math.min(n, 1); motivos.push(t("m_dir")); }
  if (w >= 12 && g - w >= 12) { n = Math.max(0, n - 1); motivos.push(t("m_rach")); }
  if (ola != null && aprender && ola >= 2) { n = Math.max(0, n - 1); motivos.push(t("m_mucha_ola")); }
  if (ola != null && ola >= 3.5 && !experto) { n = Math.max(0, n - 1); motivos.push(t("m_olas_grandes")); }
  if (codigo >= 95) { n = 0; motivos.push(t("m_tormenta")); }
  return { n, motivos };
}
// Agrupa horas seguidas: [12,13,14,17] → "12–15 h y 17 h"
function rangos(horas) {
  const r = [];
  horas.forEach(hh => { const u = r[r.length - 1]; if (u && hh === u[1] + 1) u[1] = hh; else r.push([hh, hh]); });
  return r.map(([a, b]) => a === b ? `${a} h` : `${a}–${b + 1} h`).join(", ");
}

const conv = (kn) => Math.round(kn * UNIDADES[unidad].f);
// Colores por fuerza del viento (en nudos)
function color(kn) {
  if (kn < 8) return "#CFE3F2";
  if (kn < 12) return "#9FE0B5";
  if (kn < 16) return "#56C97A";
  if (kn < 20) return "#F5E063";
  if (kn < 25) return "#F7A840";
  if (kn < 30) return "#F06A4A";
  if (kn < 35) return "#E0457B";
  return "#B36BE0";
}
// El viento viene DE esa dirección: la flecha apunta hacia donde va
const flecha = (g) => `<span class="flecha" style="transform:rotate(${(g + 180) % 360}deg)">↑</span>`;
const ICONO = (c) => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 67 ? "🌧️" : c <= 77 ? "❄️" : c <= 82 ? "🌦️" : "⛈️";
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Datos (Open-Meteo, gratis y sin clave) ----------
async function viento(spot) {
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}` +
    `&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,weather_code,precipitation_probability` +
    `&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,weather_code` +
    `&daily=sunrise,sunset&wind_speed_unit=kn&timezone=${encodeURIComponent(tzDe(spot))}&forecast_days=7&cell_selection=${spot.interior ? "land" : "sea"}`;
  const r = await fetch(u); if (!r.ok) throw new Error("viento " + r.status); return r.json();
}
async function olas(spot) {
  if (spot.interior) return null; // embalse: sin olas ni mareas
  const u = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}` +
    `&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period,swell_wave_direction` +
    `&minutely_15=sea_level_height_msl&current=wave_height,wave_period,wave_direction,sea_surface_temperature&timezone=${encodeURIComponent(tzDe(spot))}&forecast_days=7`;
  const r = await fetch(u); if (!r.ok) throw new Error("olas " + r.status); return r.json();
}
// Viento de ahora en todos los spots de una vez (para la lista)
async function vientoAhoraTodos() {
  const grupos = [SPOTS.filter(s => !s.interior), SPOTS.filter(s => s.interior)];
  await Promise.all(grupos.map(async (lista, k) => {
    if (!lista.length) return;
    const lat = lista.map(s => s.lat).join(","), lon = lista.map(s => s.lon).join(",");
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code&wind_speed_unit=kn&timezone=auto&cell_selection=${k ? "land" : "sea"}`;
    const r = await fetch(u); const j = await r.json();
    (Array.isArray(j) ? j : [j]).forEach((d, i) => { if (lista[i]) lista[i].ahora = d.current; });
  }));
}

    </div>

  if (formListo(CONFIG.quedadas || {})) cargarQuedadas().then(l => {
    const n = proximas(l).length, e = $("#numQ");

    if (e && n) e.textContent = t("cv_atajo_n", { n });

  }).catch(() => {});
}

const hoyISO = (tz = "Atlantic/Canary") => new Date().toLocaleDateString("sv-SE", { timeZone: tz });
const horaAhora = (tz = "Atlantic/Canary") => new Date().toLocaleTimeString("es-ES", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
const formListo = (f) => f && f.form && Object.values(f.campos).every(Boolean);

// Envía las respuestas a un formulario de Google (sin salir de la app)
async function enviarFormulario(f, valores) {
  const datos = new URLSearchParams();
  Object.entries(valores).forEach(([k, v]) => { if (f.campos[k]) datos.append(f.campos[k], v ?? ""); });
  const destino = f.form.replace(/\/viewform.*$/, "/formResponse");
  await fetch(destino, { method: "POST", mode: "no-cors", body: datos });
}

// Previsión del modelo a esa hora, para comparar con lo que dice la gente
function prevision(spot, hora) {
  const c = cache[spot.id]; if (!c) return "";
  const t = hoyISO(tzDe(spot)) + "T" + hora.slice(0, 2) + ":00";
  const i = c.v.hourly.time.indexOf(t); if (i < 0) return "";
  const H = c.v.hourly;
  return `${Math.round(H.wind_speed_10m[i])} kn, rachas ${Math.round(H.wind_gusts_10m[i])} kn, ${rumbo(H.wind_direction_10m[i])}`;
}

// Lee la hoja de respuestas publicada (CSV) y enseña los reportes de este spot
let reportesCache = null;
function leerCSV(texto) {
  const filas = []; let fila = [], campo = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (comillas) {
      if (ch === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (ch === '"') comillas = false;
      else campo += ch;
    } else if (ch === '"') comillas = true;
    else if (ch === ",") { fila.push(campo); campo = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && texto[i + 1] === "\n") i++; fila.push(campo); filas.push(fila); fila = []; campo = ""; }
    else campo += ch;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}
async function cargarReportes() {
  if (reportesCache && Date.now() - reportesCache.t < 5 * 60 * 1000) return reportesCache.lista;
  const r = await fetch(CONFIG.reportes.csv + (CONFIG.reportes.csv.includes("?") ? "&" : "?") + "t=" + Date.now());
  const filas = leerCSV(await r.text());
  const cab = filas.shift().map(h => h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""));
  const col = (palabra) => cab.findIndex(h => h.includes(palabra));
  const C = { spot: col("spot"), fecha: col("fecha"), hora: col("hora"), viento: col("viento"), rachas: col("rachas"), direccion: col("direccion"),
    mar: col("mar"), valoracion: col("valoracion"), material: col("material"), comentario: col("comentario"), nombre: col("nombre"), prevision: col("prevision") };
  const lista = filas.filter(f => f.length > 1).map(f => Object.fromEntries(Object.entries(C).map(([k, i]) => [k, i >= 0 ? (f[i] || "").trim() : ""])));
  // La hoja puede devolver la fecha como 2026-11-08 o 8/11/2026, y la hora como 14:00 o 14:00:00
  lista.forEach(r => {
    const d = r.fecha.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (d) r.fecha = `${d[3]}-${d[2].padStart(2, "0")}-${d[1].padStart(2, "0")}`;
    const h = r.hora.match(/(\d{1,2}):(\d{2})/);
    if (h) r.hora = `${h[1].padStart(2, "0")}:${h[2]}`;
  });
  reportesCache = { t: Date.now(), lista };
  return lista;
}
async function pintarReportes(spot) {
  const caja = $("#cajaReportes"); if (!caja) return;
  if (!CONFIG.reportes.csv) { caja.innerHTML = `<h3>${t("gente")}</h3><p class="aviso">${t("gente_cfg")}</p>`; return; }
  caja.innerHTML = `<h3>${t("gente")}</h3><p class="aviso">${t("gente_cargando")}</p>`;
  try {

        ${r.direccion ? esc(dirIdioma(r.direccion)) : ""} ${r.mar ? "· " + esc(r.mar) : ""} ${r.material ? "· " + esc(r.material) : ""}</div>

// ---------- Quedadas: downwinds, sesiones… (formulario de Google + hoja pública, como los reportes) ----------
// Para quitar una quedada (spam o cancelada) se borra su fila en la hoja «Canelo Wind · Quedadas (respuestas)».
let quedadasCache = null, quedadasLocales = [];
const TIPOS_Q = [0, 1, 2, 3], NIVELES_Q = [0, 1, 2];
const tipoQ = (v) => { const k = TIPOS_Q.find(k => TXT.es["q_tipo" + k] === v); return k != null ? t("q_tipo" + k) : v; };
const nivelQ = (v) => { const k = NIVELES_Q.find(k => TXT.es["q_niv" + k] === v); return k != null ? t("q_niv" + k) : v; };
const iconoQ = (v) => v === TXT.es.q_tipo0 ? "🌊" : v === TXT.es.q_tipo2 ? "🎓" : "🤙";
const spotDe = (id) => SPOTS.find(s => s.id === id);
const tzQ = (q) => spotDe(q.salida) ? tzDe(spotDe(q.salida)) : "Europe/Madrid";
const limpiaInsta = (v) => (v || "").trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/^@/, "").replace(/[^\w.]/g, "").slice(0, 30);
// La hoja puede devolver la fecha como 2026-11-08 o 8/11/2026, y la hora como 14:00 o 14:00:00
function normalizaFechaHora(r) {
  const d = (r.fecha || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (d) r.fecha = `${d[3]}-${d[2].padStart(2, "0")}-${d[1].padStart(2, "0")}`;
  const h = (r.hora || "").match(/(\d{1,2}):(\d{2})/);
  if (h) r.hora = `${h[1].padStart(2, "0")}:${h[2]}`;
}
async function cargarQuedadas() {
  if (!quedadasCache || Date.now() - quedadasCache.t > 3 * 60 * 1000) {
    const csv = CONFIG.quedadas.csv;
    const r = await fetch(csv + (csv.includes("?") ? "&" : "?") + "t=" + Date.now());
    const filas = leerCSV(await r.text());
    const cab = (filas.shift() || []).map(h => h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""));
    const claves = ["tipo", "fecha", "hora", "salida", "llegada", "encuentro", "nivel", "material", "detalles", "nombre", "instagram"];
    const C = Object.fromEntries(claves.map(k => [k, cab.findIndex(h => h.includes(k))]));
    const lista = filas.filter(f => f.length > 1).map(f => Object.fromEntries(Object.entries(C).map(([k, i]) => [k, i >= 0 ? (f[i] || "").trim() : ""])));
    lista.forEach(normalizaFechaHora);
    // Las que acabas de publicar se ven ya; se quitan cuando aparecen en la hoja
    quedadasLocales = quedadasLocales.filter(q => !lista.some(r => r.fecha === q.fecha && r.hora === q.hora && r.salida === q.salida && r.nombre === q.nombre));
    quedadasCache = { t: Date.now(), lista };
  }
  return [...quedadasCache.lista, ...quedadasLocales];
}
const proximas = (l) => l.filter(q => q.fecha && q.salida && q.fecha >= hoyISO(tzQ(q)))
  .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
const diaQ = (q) => q.fecha === hoyISO(tzQ(q)) ? t("hoy") : new Date(q.fecha + "T12:00").toLocaleDateString(localeIdioma(), { weekday: "long", day: "numeric", month: "long" });

function tarjetaQuedada(q, i) {
  const s = spotDe(q.salida), ll = q.llegada && q.llegada !== q.salida ? spotDe(q.llegada) : null;
  const sitio = (sp, id) => sp ? `<a href="#spot=${sp.id}">${esc(sp.nombre)}</a>` : esc(id || "");
  const insta = limpiaInsta(q.instagram);
  return `<div class="quedada">
    <div><span class="tipo-q">${iconoQ(q.tipo)} ${esc(tipoQ(q.tipo))}</span>${q.nivel ? `<span class="etq" style="margin:0">${esc(nivelQ(q.nivel))}</span>` : ""}</div>
    <div class="cuando" style="margin-top:6px">${esc(diaQ(q))}${q.hora ? " · " + esc(q.hora) : ""}</div>
    <div class="ruta">📍 ${sitio(s, q.salida)}${ll ? ` → ${sitio(ll, q.llegada)}` : ""}</div>
    ${q.encuentro ? `<div class="det">🚩 ${t("q_encuentro")}: ${esc(q.encuentro)}</div>` : ""}
    ${q.material ? `<div class="det">🏄 ${esc(q.material)}</div>` : ""}
    ${q.detalles ? `<div class="det">${esc(q.detalles)}</div>` : ""}
    <div class="aviso">${t("q_organiza")}: <b>${esc(q.nombre || t("anonimo"))}</b>${insta ? ` · <a href="https://www.instagram.com/${insta}/" target="_blank" rel="noopener">📸 @${esc(insta)}</a>` : ""}</div>
    <div class="acc">${s ? `<a class="btn sec peq" href="#spot=${s.id}" style="text-decoration:none">🌬️ ${t("q_prev")}</a>` : ""}<button class="btn sec peq" data-qi="${i}">📤 ${t("q_compartir")}</button></div>
  </div>`;
}
function activarQuedadas(caja, l) {
  caja.querySelectorAll("[data-qi]").forEach(b => b.onclick = () => compartirQuedada(l[+b.dataset.qi]));
}
async function compartirQuedada(q) {
  const s = spotDe(q.salida), ll = q.llegada && spotDe(q.llegada);
  const url = "https://canelowind.com/#quedadas";
  const texto = t("q_txt_compartir", { tipo: tipoQ(q.tipo), dia: diaQ(q), hora: q.hora || "", spot: (s ? s.nombre : q.salida) + (ll && ll !== s ? " → " + ll.nombre : "") });
  contar("compartir-quedada/" + q.salida, "Quedada compartida", true);
  if (navigator.share) {
    try { await navigator.share({ title: "Canelo Wind · " + t("q_banner"), text: texto, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(texto + "\n" + url); avisoCorto(t("comp_copiado")); } catch (e) {}
  window.open("https://wa.me/?text=" + encodeURIComponent(texto + "\n" + url), "_blank", "noopener");
}

const BOLITA = ["🔴", "🟠", "🟡", "🟢", "🟢"];
async function compartirSpot(spot, ev, c) {
  const url = "https://canelowind.com/spot/" + spot.id + "/";
  const u = UNIDADES[unidad].c;
  const texto = t("comp_texto", {
    b: BOLITA[ev.n], n: spot.nombre, nota: t("n" + ev.n),
    v: conv(c.wind_speed_10m), r: conv(c.wind_gusts_10m), u, d: rumbo(c.wind_direction_10m),
  }) + "\n" + t("comp_mira");
  contar("compartir/" + spot.id, "Compartido · " + spot.nombre, true);
  if (navigator.share) {
    try { await navigator.share({ title: "Canelo Wind · " + spot.nombre, text: texto, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }

  // Sin «compartir» del sistema (ordenador): abrir WhatsApp con el texto y copiarlo
  try { await navigator.clipboard.writeText(texto + "\n" + url); avisoCorto(t("comp_copiado")); } catch (e) {}
  window.open("https://wa.me/?text=" + encodeURIComponent(texto + "\n" + url), "_blank", "noopener");
}

// Gráfica del día: barras de viento y línea de rachas
// ---------- Avisos que cambian según la previsión del día elegido ----------
function pintarAvisosDia(spot, dia, olaEn) {
  const caja = $("#avisosDia"); if (!caja) return;
  const { v, o } = cache[spot.id], H = v.hourly;
  const experto = /experto/i.test(spot.nivel);
  const idx = H.time.map((t, i) => t.startsWith(dia) && +t.slice(11, 13) >= 7 && +t.slice(11, 13) <= 20 ? i : -1).filter(i => i >= 0);
  const hh = (i) => +H.time[i].slice(11, 13);
  const avisos = [];
  // Viento o rachas muy fuertes
  const fuertes = idx.filter(i => H.wind_gusts_10m[i] >= (experto ? 40 : 30));
  if (fuertes.length) {
    const max = Math.max(...fuertes.map(i => H.wind_gusts_10m[i]));
    avisos.push(t("a_rachas", { v: conv(max), u: UNIDADES[unidad].c, h: rangos(fuertes.map(hh)), x: experto ? t("a_rachas_exp") : t("a_rachas_norm") }));
  }
  // Muy racheado
  const racheado = idx.filter(i => H.wind_speed_10m[i] >= 12 && H.wind_gusts_10m[i] - H.wind_speed_10m[i] >= 12);
  if (racheado.length) avisos.push(t("a_rach", { h: rangos(racheado.map(hh)) }));
  // Viento de tierra (off-shore)
  const peligro = consejosDe(spot).peligro || [];
  const off = peligro.length ? idx.filter(i => H.wind_speed_10m[i] >= 6 && enDirecciones(peligro, H.wind_direction_10m[i])) : [];
  if (off.length) avisos.push(t("a_off", { h: rangos(off.map(hh)) }));
  // Dirección mala con viento
  const mala = idx.filter(i => H.wind_speed_10m[i] >= 12 && !dirBuena(spot, H.wind_direction_10m[i]) && !off.includes(i));
  if (mala.length >= 3) avisos.push(t("a_dir", { h: rangos(mala.map(hh)) }));
  // Tormentas
  const tormenta = idx.filter(i => H.weather_code[i] >= 95);
  if (tormenta.length) avisos.push(t("a_torm", { h: rangos(tormenta.map(hh)) }));
  // Olas grandes
  const olas = idx.map(i => olaEn(H.time[i])).filter(x => x != null);
  const maxOla = olas.length ? Math.max(...olas) : 0;
  if (maxOla >= (experto ? 4 : 2.5)) avisos.push(t("a_olas", { v: maxOla.toLocaleString(localeIdioma(), { maximumFractionDigits: 1 }) }));
  // Marea baja en spots que necesitan marea alta
  if (consejosDe(spot).marea === "alta" && o && o.minutely_15) {
    const M = o.minutely_15, alt = M.sea_level_height_msl;
    const k = M.time.map((t, i) => t.startsWith(dia) && alt[i] != null ? i : -1).filter(i => i >= 0);
    const bajas = [], altas = [];
    for (let j = 1; j < k.length - 1; j++) {
      const a = alt[k[j - 1]], b = alt[k[j]], c = alt[k[j + 1]];
      if (b <= a && b < c) bajas.push(M.time[k[j]].slice(11, 16));
      if (b >= a && b > c) altas.push(M.time[k[j]].slice(11, 16));
    }
    if (bajas.length) avisos.push(t("a_bajamar", { b: bajas.join(" " + t("y") + " "), a: altas.length ? " (" + altas.join(" " + t("y") + " ") + ")" : "" }));
  }
  // Sin viento en todo el día
  const conViento = idx.filter(i => H.wind_speed_10m[i] >= 11);
  if (!conViento.length) avisos.push(t("a_sinviento"));
  caja.innerHTML = avisos.length
    ? `<div class="avisos-dia"><b>${t("avisos_tit")}</b><ul>${avisos.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`
    : `<div class="avisos-dia ok">${t("sin_avisos")}</div>`;
}

// ---------- Mareas: curva del día con pleamar, bajamar y horas de sol ----------
function pintarMareas(spot, dia, daily, iDia) {
  const caja = $("#cajaMareas"); if (!caja) return;
  const o = cache[spot.id] && cache[spot.id].o;
  const M = o && o.minutely_15;
  const idx = M ? M.time.map((t, i) => t.startsWith(dia) && M.sea_level_height_msl[i] != null ? i : -1).filter(i => i >= 0) : [];
  if (spot.interior) { caja.innerHTML = `<h3>${t("mareas")}</h3><p class="aviso">${t("embalse")}</p>`; return; }
  if (idx.length < 10) { caja.innerHTML = `<h3>${t("mareas")}</h3><p class="aviso">${t("sin_marea")}</p>`; return; }
  const alt = M.sea_level_height_msl, hora = (t) => t.slice(11, 16);
  const minutos = (t) => +t.slice(11, 13) * 60 + +t.slice(14, 16);

  // Pleamares y bajamares: puntos más altos y más bajos de la curva
  const extremos = [];
  for (let k = 1; k < idx.length - 1; k++) {
    const a = alt[idx[k - 1]], b = alt[idx[k]], c = alt[idx[k + 1]];
    if (b >= a && b > c) extremos.push({ tipo: "alta", i: idx[k] });
    else if (b <= a && b < c) extremos.push({ tipo: "baja", i: idx[k] });
  }
  const vals = idx.map(i => alt[i]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 0.6) { const m = (hi + lo) / 2; lo = m - 0.3; hi = m + 0.3; }
  lo -= 0.25; hi += 0.35;

  const W = 400, Ht = 190, pl = 30, pr = 8, pt = 26, pb = 22;
  const x = (t) => pl + (minutos(t) / 1440) * (W - pl - pr);
  const y = (v) => pt + (hi - v) / (hi - lo) * (Ht - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Marea del día" style="width:100%;max-width:640px;height:auto;display:block;margin:6px auto 0">`;

  // Noche en gris, día en azul claro (con la salida y puesta de sol)
  const salida = daily && daily.sunrise[iDia], puesta = daily && daily.sunset[iDia];
  s += `<rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${Ht - pt - pb}" fill="var(--chip)"/>`;
  if (salida && puesta) {
    s += `<rect x="${x(salida)}" y="${pt}" width="${x(puesta) - x(salida)}" height="${Ht - pt - pb}" fill="#9fd3f0" opacity=".35"/>`;
    s += `<text x="${x(salida)}" y="${pt - 8}" font-size="12" text-anchor="middle" fill="#D9A520">☀️↑ ${hora(salida)}</text>`;
    s += `<text x="${x(puesta)}" y="${pt - 8}" font-size="12" text-anchor="middle" fill="#D9A520">☀️↓ ${hora(puesta)}</text>`;
  }
  // Líneas de altura
  for (let v = Math.ceil(lo * 2) / 2; v <= hi; v += 0.5) {
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${pl - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${v.toFixed(1).replace(".", ",")}</text>`;
  }
  // Agua y curva
  const pts = idx.map(i => `${x(M.time[i]).toFixed(1)},${y(alt[i]).toFixed(1)}`);
  s += `<polygon points="${pl},${Ht - pb} ${pts.join(" ")} ${x(M.time[idx[idx.length - 1]]).toFixed(1)},${Ht - pb}" fill="#4FB3E8" opacity=".25"/>`;
  s += `<polyline points="${pts.join(" ")}" fill="none" stroke="#2C9AD6" stroke-width="3"/>`;
  // Hora de ahora (solo hoy)
  if (iDia === 0) {
    const ahora = new Date().toLocaleTimeString("es-ES", { timeZone: tzDe(spot), hour: "2-digit", minute: "2-digit" });
    const xa = x("0000-00-00T" + ahora);
    s += `<line x1="${xa}" x2="${xa}" y1="${pt}" y2="${Ht - pb}" stroke="#7BC043" stroke-width="2"/>`;
  }
  // Pleamar en azul, bajamar en rojo
  extremos.forEach(e => {
    const cx = x(M.time[e.i]), cy = y(alt[e.i]), col = e.tipo === "alta" ? "#2C7BC0" : "#C8423B";
    s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${col}"/>`;
    s += `<text x="${cx}" y="${e.tipo === "alta" ? cy - 12 : cy + 20}" font-size="13" font-weight="700" text-anchor="middle" fill="${col}">${hora(M.time[e.i])}</text>`;
  });
  // Eje de horas
  for (let hh = 0; hh <= 24; hh += 3) {
    const xx = pl + (hh / 24) * (W - pl - pr);
    s += `<text x="${xx}" y="${Ht - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${hh}h</text>`;
  }
  s += `</svg>`;

  const resumen = extremos.map(e => `<span class="etq" style="color:${e.tipo === "alta" ? "#2C7BC0" : "#C8423B"};font-weight:700">${e.tipo === "alta" ? t("pleamar") : t("bajamar")} ${hora(M.time[e.i])} · ${alt[e.i].toLocaleString(localeIdioma(), { minimumFractionDigits: 1, maximumFractionDigits: 1 })} m</span>`).join(" ");
  caja.innerHTML = `<h3>${t("mareas")}</h3><div>${resumen}</div>${s}
    <p class="aviso">${t("mareas_nota", { a: iDia === 0 ? t("linea_ahora") : "" })}</p>`;
}

function grafica(H, dia) {
  const idx = H.time.map((t, i) => t.startsWith(dia) ? i : -1).filter(i => i >= 0);
  const W = 720, Ht = 160, pad = 24, bw = (W - pad * 2) / idx.length;
  const max = Math.max(25, ...idx.map(i => H.wind_gusts_10m[i])) * 1.1;
  const y = (k) => Ht - pad - (k / max) * (Ht - pad * 2);
  let s = `<svg viewBox="0 0 ${W} ${Ht}" preserveAspectRatio="none" role="img" aria-label="Viento y rachas del día">`;
  [10, 20, 30, 40].filter(k => k < max).forEach(k => {
    s += `<line x1="${pad}" x2="${W - pad}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-width="1"/>
      <text x="2" y="${y(k) + 4}" font-size="10" fill="var(--muted)">${conv(k)}</text>`;
  });
  idx.forEach((i, n) => {
    const w = H.wind_speed_10m[i];
    s += `<rect x="${pad + n * bw + 2}" y="${y(w)}" width="${bw - 4}" height="${Ht - pad - y(w)}" rx="3" fill="${color(w)}"/>`;
    if (n % 3 === 0) s += `<text x="${pad + n * bw + bw / 2}" y="${Ht - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${H.time[i].slice(11, 13)}h</text>`;
  });
  s += `<polyline fill="none" stroke="var(--brand)" stroke-width="2" points="${idx.map((i, n) => `${pad + n * bw + bw / 2},${y(H.wind_gusts_10m[i])}`).join(" ")}"/>`;
  s += `</svg><div class="aviso" style="margin-top:2px">${t("grafica", { u: UNIDADES[unidad].c })}</div>`;
  $("#grafica").innerHTML = s;
}

// ---------- Compraventa de material de segunda mano ----------
// Los anuncios se mandan a un Apps Script (CONFIG.compraventa.url) que guarda las fotos en Drive y apunta el anuncio en una hoja
// pública; la app lee esa hoja (CSV). «Vendido», «Quitar» y «Renovar» van con un secreto que solo tiene el móvil del vendedor.
const CATS_V = [0, 1, 2, 3, 4], ESTADOS_V = [0, 1, 2, 3, 4], ICONOS_V = ["🪽", "🪁", "🏄", "🧤", "📦"];
const DIAS_V = 30, OCULTAR_V = 37;
const cvListo = () => !!(CONFIG.compraventa && CONFIG.compraventa.url && CONFIG.compraventa.csv);
const desdeEs = (prefijo, lista, v) => { const k = lista.find(k => TXT.es[prefijo + k] === v); return k != null ? t(prefijo + k) : v; };
const catV = (v) => desdeEs("cv_cat", CATS_V, v), estV = (v) => desdeEs("cv_est", ESTADOS_V, v);
const iconoV = (v) => ICONOS_V[CATS_V.find(k => TXT.es["cv_cat" + k] === v) ?? 4];
const fotoUrl = (id, w = 800) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const misAnuncios = () => leer("misAnuncios", []);
const esMio = (a) => misAnuncios().some(m => m.id === a.id);
const diasDesde = (iso) => (Date.now() - Date.parse(iso)) / 864e5;
const precioV = (a) => (+a.precio).toLocaleString(localeIdioma()) + " €";
let anunciosCache = null, filtroCat = "Todas", filtroZonaV = "Todas";

async function cargarAnuncios(forzar) {
  if (forzar || !anunciosCache || Date.now() - anunciosCache.t > 2 * 60 * 1000) {
    const csv = CONFIG.compraventa.csv;
    const r = await fetch(csv + (csv.includes("?") ? "&" : "?") + "t=" + Date.now());
    const filas = leerCSV(await r.text());
    const cab = (filas.shift() || []).map(h => h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim());
    const claves = ["publicado", "id", "categoria", "titulo", "precio", "negociable", "estado", "isla", "zona", "descripcion", "nombre", "instagram", "whatsapp", "foto1", "foto2", "foto3", "renovado", "situacion"];
    const C = Object.fromEntries(claves.map(k => [k, cab.indexOf(k)]));
    const lista = filas.filter(f => f.length > 1).map(f => Object.fromEntries(Object.entries(C).map(([k, i]) => [k, i >= 0 ? (f[i] || "").trim() : ""])))
      .filter(a => a.id);
    anunciosCache = { t: Date.now(), lista };
  }
  return anunciosCache.lista;
}
const visiblesV = (l) => l.filter(a => a.situacion === "activo" && diasDesde(a.renovado || a.publicado) < OCULTAR_V)
  .sort((a, b) => (b.renovado || b.publicado).localeCompare(a.renovado || a.publicado));
async function llamarCV(datos) {
  const r = await fetch(CONFIG.compraventa.url, { method: "POST", body: JSON.stringify(datos) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}
const haceV = (a) => { const d = Math.floor(diasDesde(a.publicado)); return d < 1 ? t("cv_hoy") : t("cv_hace", { n: d }); };

function tarjetaAnuncio(a, i) {

// Achica una foto del móvil (máx. 1280 px, JPEG) antes de subirla
function achicarFoto(archivo) {
  return new Promise((ok, mal) => {
    const img = new Image(), u = URL.createObjectURL(archivo);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(u); mal(new Error("foto")); };
    img.src = u;
  });
}

// A los 30 días, al abrir la app, se pregunta al vendedor si su anuncio sigue disponible
function revisarMisAnuncios(lista) {
  const mios = misAnuncios(); if (!mios.length) return;

  const vivos = mios.filter(m => { const a = lista.find(x => x.id === m.id); return a && a.situacion === "activo"; });

  const viejo = vivos.map(m => ({ m, a: lista.find(x => x.id === m.id) })).find(x => diasDesde(x.a.renovado || x.a.publicado) >= DIAS_V);

  try { sessionStorage.setItem("cw_aviso_v", "1"); } catch (e) {}

  const f = document.createElement("div");

    <div id="msgAV"></div></div>`;
  document.body.appendChild(f);
  const hacer = async (datos, okTxt) => {
    try {
      await llamarCV({ ...datos, id: a.id, secreto: m.secreto });
      if (datos.accion === "quitar") guardar("misAnuncios", misAnuncios().filter(x => x.id !== a.id));
      anunciosCache = null; f.remove(); avisoCorto(okTxt);
    } catch (e) { f.querySelector("#msgAV").innerHTML = `<div class="msg">${t("err_envio")}</div>`; }
  };
  f.querySelector("#sigueV").onclick = () => hacer({ accion: "renovar" }, t("cv_ok_renovado"));
  f.querySelector("#vendiV").onclick = () => hacer({ accion: "quitar", vendido: true }, t("cv_ok_vendido"));
  f.querySelector("#luegoV").onclick = () => f.remove();
}

// ---------- Mis spots: spots privados que solo ve quien los crea (se guardan en el móvil) ----------
const MIS = "Mis spots";
const misSpots = () => SPOTS.filter(s => s.propio);
const DIRS8 = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
const NIVELES_MIO = ["Todos los niveles", "Iniciación / intermedio", "Intermedio", "Intermedio / avanzado", "Avanzado (olas)", "Experto"];
function prepararPropio(s) {
  return { id: s.id, nombre: String(s.nombre || "").slice(0, 60), lat: +s.lat, lon: +s.lon,
    deportes: (s.deportes || []).filter(d => ["windsurf", "kite", "wing"].includes(d)),
    buenos: (s.buenos || []).filter(d => DIRS8.includes(d)), nivel: NIVELES_MIO.includes(s.nivel) ? s.nivel : "Todos los niveles",
    nota: String(s.nota || "").slice(0, 400), interior: !!s.interior,
    propio: true, region: MIS, isla: MIS, zona: "", tz: +s.lon < -12 ? "Atlantic/Canary" : "Europe/Madrid", anemometros: [], webcams: [] };
}
const datosMio = (s) => ({ id: s.id, nombre: s.nombre, lat: s.lat, lon: s.lon, deportes: s.deportes, buenos: s.buenos, nivel: s.nivel, nota: s.nota, interior: s.interior });
const valido = (s) => s && s.nombre && isFinite(s.lat) && isFinite(s.lon) && Math.abs(s.lat) <= 90 && Math.abs(s.lon) <= 180 && s.deportes.length;
function guardarMisSpots() { guardar("misSpots", misSpots().map(datosMio)); }
function anadirMiSpot(datos) {
  const s = prepararPropio({ ...datos, id: "mi-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) });
  if (!valido(s)) return null;
  SPOTS.push(s); guardarMisSpots(); return s;
}
leer("misSpots", []).forEach(d => { const s = prepararPropio(d); if (valido(s) && !SPOTS.some(x => x.id === s.id)) SPOTS.push(s); });

// Mapa (Leaflet + OpenStreetMap), se carga solo al abrir el formulario
let leafletListo = null;
function cargarLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletListo) return leafletListo;
  leafletListo = new Promise((ok, mal) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; js.onload = ok; js.onerror = mal; document.head.appendChild(js);
  });
  return leafletListo;
}

function abrirFormMiSpot(editar) {
  if (document.querySelector(".fondo")) return;
  const s = editar || {};
  let lat = editar ? s.lat : null, lon = editar ? s.lon : null;
  const buenos = new Set(editar ? s.buenos : []);
  const rosa = [["NO", "N", "NE"], ["O", "", "E"], ["SO", "S", "SE"]];
  const fondo = document.createElement("div");
  fondo.className = "fondo";
  fondo.innerHTML = `<div class="caja"><h3>${editar ? t("ms_editar_tit") : t("ms_crear_tit")}</h3>
    <p class="aviso" style="margin-top:-4px">${t("ms_privado_txt")}</p>
    <div class="form" id="fMio">
      <label class="ancho">${t("ms_nombre")}<input name="nombre" maxlength="60" value="${esc(s.nombre || "")}" placeholder="${t("ms_ph_nombre")}"></label>
      <div class="ancho"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">${t("ms_donde")}</div>
        <div id="mapaMio" class="mapa-mio"></div>
        <div class="fila" style="margin-top:6px"><button type="button" class="btn sec peq" id="aquiMio">${t("ms_aqui")}</button><span class="aviso" style="margin:0" id="estadoMapa">${editar ? t("ms_marcado") : t("ms_toca")}</span></div></div>
      <div class="ancho"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">${t("ms_deportes")}</div>
        <div class="chips" style="margin:0">${["windsurf", "kite", "wing"].map(d => `<label class="chip ${(s.deportes || []).includes(d) ? "on" : ""}"><input type="checkbox" name="dep" value="${d}" ${(s.deportes || []).includes(d) ? "checked" : ""} style="display:none">${{ windsurf: "🏄 ", kite: "🪁 ", wing: "🪽 " }[d]}${t("dep_" + d)}</label>`).join("")}</div></div>
      <div class="ancho"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">${t("ms_dirs")}</div>
        <div class="rosa">${rosa.flat().map(d => d ? `<button type="button" class="${buenos.has(d) ? "on" : ""}" data-dir="${d}">${dirIdioma(d)}</button>` : `<span>🧭</span>`).join("")}</div></div>
      <label>${t("ms_nivel")}<select name="nivel">${NIVELES_MIO.map(n => `<option value="${esc(n)}" ${n === s.nivel ? "selected" : ""}>${esc(nombreNivel(n))}</option>`).join("")}</select></label>
      <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="interior" ${s.interior ? "checked" : ""}> ${t("ms_interior")}</label>
      <label class="ancho">${t("ms_nota")}<textarea name="nota" rows="2" maxlength="400" placeholder="${t("ms_ph_nota")}">${esc(s.nota || "")}</textarea></label>
      <div class="ancho fila"><button class="btn" id="guardarMio">${t("ms_guardar")}</button><button class="btn sec" id="cerrarMio">${t("cancelar")}</button></div>
    </div><div id="msgMio"></div></div>`;
  document.body.appendChild(fondo);
  const cerrar = () => fondo.remove();
  fondo.onclick = (e) => { if (e.target === fondo) cerrar(); };
  fondo.querySelector("#cerrarMio").onclick = cerrar;
  fondo.querySelectorAll("label.chip input").forEach(c => c.onchange = () => c.parentElement.classList.toggle("on", c.checked));
  fondo.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { const d = b.dataset.dir; buenos.has(d) ? buenos.delete(d) : buenos.add(d); b.classList.toggle("on", buenos.has(d)); });

  // Mapa: tocar para marcar, o «Estoy aquí»
  let mapa = null, marca = null;
  const poner = (la, lo, zoom) => {
    lat = +la.toFixed(5); lon = +lo.toFixed(5);
    if (mapa) { if (marca) marca.setLatLng([lat, lon]); else marca = L.circleMarker([lat, lon], { radius: 11, color: "#fff", weight: 3, fillColor: "#B85A22", fillOpacity: 1 }).addTo(mapa); if (zoom) mapa.setView([lat, lon], zoom); }
    $("#estadoMapa").textContent = t("ms_marcado") + ` (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
  };
  cargarLeaflet().then(() => {
    if (!document.body.contains(fondo)) return;
    mapa = L.map("mapaMio", { zoomControl: true });
    mapa.attributionControl.setPrefix(false);
    mapa.setView(lat != null ? [lat, lon] : [34, -9], lat != null ? 14 : 5);
    const calles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" });
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "© Esri" });
    (lat != null ? sat : calles).addTo(mapa);
    L.control.layers({ [t("ms_mapa")]: calles, [t("ms_sat")]: sat }, null, { position: "topright" }).addTo(mapa);
    mapa.on("click", (e) => poner(e.latlng.lat, e.latlng.lng));
    if (lat != null) poner(lat, lon);
    setTimeout(() => mapa.invalidateSize(), 200);
  }).catch(() => { $("#estadoMapa").textContent = t("q_error"); });
  fondo.querySelector("#aquiMio").onclick = () => {
    if (!navigator.geolocation) { $("#estadoMapa").textContent = t("ms_sin_gps"); return; }
    $("#estadoMapa").textContent = t("ms_buscando");
    navigator.geolocation.getCurrentPosition(p => poner(p.coords.latitude, p.coords.longitude, 15),
      () => { $("#estadoMapa").textContent = t("ms_sin_gps"); }, { enableHighAccuracy: true, timeout: 15000 });
  };

  fondo.querySelector("#guardarMio").onclick = () => {
    const F = fondo.querySelector("#fMio");
    const datos = { nombre: F.querySelector("[name=nombre]").value.trim(), lat, lon,
      deportes: [...F.querySelectorAll("[name=dep]:checked")].map(c => c.value), buenos: [...buenos],
      nivel: F.querySelector("[name=nivel]").value, interior: F.querySelector("[name=interior]").checked, nota: F.querySelector("[name=nota]").value.trim() };
    if (!datos.nombre || lat == null || !datos.deportes.length) { fondo.querySelector("#msgMio").innerHTML = `<div class="msg">${t("ms_falta")}</div>`; return; }
    let destino;
    if (editar) {
      const nuevo = prepararPropio({ ...datos, id: editar.id });
      Object.keys(editar).forEach(k => delete editar[k]); Object.assign(editar, nuevo);
      delete cache[editar.id]; guardarMisSpots(); destino = editar;
    } else {
      destino = anadirMiSpot(datos); contar("mi-spot-creado", "Spot propio creado", true);
    }
    cerrar();
    vientoAhoraTodos().catch(() => {});
    if (location.hash === "#spot=" + destino.id) router(); else location.hash = "spot=" + destino.id;
  };
}

function borrarMiSpot(spot) {
  if (!confirm(t("ms_borrar_conf", { n: spot.nombre }))) return;
  const i = SPOTS.indexOf(spot); if (i >= 0) SPOTS.splice(i, 1);
  favoritos = favoritos.filter(x => x !== spot.id); guardar("favoritos", favoritos);
  guardarMisSpots(); location.hash = "";
}

// Pasar un spot propio a un amigo: un enlace con los datos (no se guarda en ningún sitio más)
async function pasarMiSpot(spot) {
  const d = datosMio(spot); delete d.id;
  const url = "https://canelowind.com/#amigo=" + encodeURIComponent(JSON.stringify(d));
  const texto = t("ms_pasar_txt", { n: spot.nombre });
  contar("mi-spot-pasado", "Spot propio pasado a un amigo", true);
  if (navigator.share) {
    try { await navigator.share({ title: "Canelo Wind · " + spot.nombre, text: texto, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(texto + "\n" + url); avisoCorto(t("comp_copiado")); } catch (e) {}
  window.open("https://wa.me/?text=" + encodeURIComponent(texto + "\n" + url), "_blank", "noopener");
}
function recibirMiSpot(texto) {
  let d = null;
  try { d = JSON.parse(decodeURIComponent(texto)); } catch (e) {}
  const prueba = d && prepararPropio({ ...d, id: "x" });
  pintarLista();
  if (!prueba || !valido(prueba)) { avisoCorto(t("ms_mal")); history.replaceState(null, "", location.pathname + location.search); return; }
  const ya = misSpots().find(s => s.nombre === prueba.nombre && Math.abs(s.lat - prueba.lat) < 1e-4 && Math.abs(s.lon - prueba.lon) < 1e-4);
  if (ya) { location.hash = "spot=" + ya.id; return; }
  const f = document.createElement("div");
  f.className = "fondo";
  f.innerHTML = `<div class="caja"><h3>${t("ms_recibir_tit")}</h3><p>${t("ms_recibir_txt", { n: esc(prueba.nombre) })}</p>
    <div class="fila"><button class="btn" id="siMio">${t("ms_anadir")}</button><button class="btn sec" id="noMio">${t("ms_no")}</button></div></div>`;
  document.body.appendChild(f);
  f.querySelector("#noMio").onclick = () => { f.remove(); location.hash = ""; };
  f.querySelector("#siMio").onclick = () => {
    const s = anadirMiSpot(d); f.remove(); contar("mi-spot-recibido", "Spot propio recibido de un amigo", true);
    vientoAhoraTodos().catch(() => {}); location.hash = "spot=" + s.id;
  };
}

// Copia de seguridad: un archivo con tus spots (para cambiar de móvil)
async function copiaMisSpots() {
  const datos = JSON.stringify({ app: "canelo-wind", tipo: "mis-spots", v: 1, fecha: new Date().toISOString().slice(0, 10), spots: misSpots().map(datosMio) }, null, 1);
  const nombre = "canelo-wind-mis-spots.json";
  const archivo = new File([datos], nombre, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: "Canelo Wind · " + t("ms_seccion") }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(archivo); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function recuperarMisSpots() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    try {
      const j = JSON.parse(await inp.files[0].text());
      if (!j || j.app !== "canelo-wind" || !Array.isArray(j.spots)) throw new Error("mal");
      let n = 0;
      j.spots.forEach(d => {
        const s = prepararPropio(d);
        if (!valido(s) || misSpots().some(x => x.id === s.id || (x.nombre === s.nombre && Math.abs(x.lat - s.lat) < 1e-4 && Math.abs(x.lon - s.lon) < 1e-4))) return;
        SPOTS.push(s); n++;
      });
      guardarMisSpots(); avisoCorto(t("ms_recuperados", { n })); pintarLista(); vientoAhoraTodos().then(() => { if (!location.hash) pintarLista(); }).catch(() => {});
    } catch (e) { avisoCorto(t("ms_copia_mala")); }
  };
  inp.click();
}

// ---------- Navegación ----------
function router() {
  if (location.hash === "#quedadas") { pintarQuedadas(); contar("/quedadas", "Quedadas"); return; }
  if (location.hash.startsWith("#amigo=")) { recibirMiSpot(location.hash.slice(7)); return; }
  if (location.hash === "#compraventa") { pintarCompraventa(); contar("/compraventa", "Compraventa"); return; }
  if (location.hash.startsWith("#anuncio=")) { pintarCompraventa(location.hash.slice(9).replace(/[^\w]/g, "")); contar("/compraventa", "Compraventa"); return; }
  const m = location.hash.match(/spot=([\w-]+)/);
  const spot = m && SPOTS.find(s => s.id === m[1]);
  if (spot) { diaElegido = 0; pintarSpot(spot); contar(spot.propio ? "/mi-spot" : "/spot/" + spot.id, spot.propio ? "Mi spot" : spot.nombre); } else pintarLista();
}
window.addEventListener("hashchange", router);

ponerTextosFijos();
if (!idiomaGuardado() && !IDIOMA_URL) elegirIdioma(true);
$("#btnUnidad").onclick = () => {
  const orden = ["kn", "kmh", "ms"]; unidad = orden[(orden.indexOf(unidad) + 1) % 3];
  guardar("unidad", unidad); $("#btnUnidad").textContent = UNIDADES[unidad].t;
  const m = location.hash.match(/spot=([\w-]+)/); const spot = m && SPOTS.find(s => s.id === m[1]);
  if (spot && cache[spot.id]) dibujarSpot(spot); else if (!location.hash || location.hash === "#") pintarLista(); else router();
};

router();
try { if (esAppInstalada() && !sessionStorage.getItem("cw_contada")) { sessionStorage.setItem("cw_contada", "1"); contar("instalada", "Abierta desde la pantalla de inicio (app instalada)", true); } } catch (e) {}
vientoAhoraTodos().then(() => { if (!location.hash || location.hash === "#") pintarLista(); }).catch(() => {});
</script>
