<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instalar Canelo Wind</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script src="visitas.js"></script>
<link rel="apple-touch-icon" href="icono-iphone.png">
<meta name="theme-color" content="#9A4416">
<style>
:root { --bg: #F6F1EA; --card: #FFFFFF; --text: #2A1E16; --muted: #7A6A5E; --line: #E7DDD1; --brand: #B85A22; --chip: #EFE4D7; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17120E; --card: #231B15; --text: #F4EAE0; --muted: #B2A193; --line: #3A2E25; --brand: #E08A3C; --chip: #33281F; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { text-align: center; padding: 28px 16px 22px; padding-top: max(28px, env(safe-area-inset-top)); background: linear-gradient(135deg, #E08A3C, #9A4416); color: #fff; }
header img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
header h1 { margin: 12px 0 4px; font-size: 26px; }
header p { margin: 0; opacity: .9; }
.banderas { display: flex; justify-content: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.banderas button { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.banderas button.on { background: #fff; color: #9A4416; }
main { max-width: 620px; margin: 0 auto; padding: 16px 16px 40px; }
.video-tit { font-weight: 700; margin: 4px 0 8px; }
.video-inst { display: block; width: 100%; max-width: 320px; margin: 0 auto 16px; border-radius: 18px; background: #9A4416; aspect-ratio: 9 / 16; }
.tabs { display: flex; gap: 8px; margin: 4px 0 14px; }
.tab { flex: 1; border: 0; background: var(--chip); color: var(--text); padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
.tab.on { background: var(--brand); color: #fff; }
.caja { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
.caja h2 { margin: 0 0 12px; font-size: 19px; }
ol.pasos { list-style: none; padding: 0; margin: 0; counter-reset: paso; }
ol.pasos li { counter-increment: paso; position: relative; padding: 0 0 18px 50px; }
ol.pasos li:last-child { padding-bottom: 0; }
ol.pasos li::before { content: counter(paso); position: absolute; left: 0; top: -2px; width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
ol.pasos b { display: block; }
.nota { color: var(--muted); font-size: 14px; }
.icono { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; background: var(--chip); font-size: 18px; vertical-align: middle; margin: 0 2px; }
.boton { display: block; text-align: center; background: var(--brand); color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 17px; }
.enlace { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.enlace input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.enlace button { border: 0; background: var(--chip); color: var(--text); padding: 10px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
ul.lista { margin: 0; padding-left: 20px; }
ul.lista li { margin-bottom: 6px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="icono-iphone.png" alt="">
  <h1 data-t="titulo">Instalar Canelo Wind</h1>
  <p data-t="sub">Ten la app en tu móvil en 1 minuto. Gratis, sin App Store.</p>
  <div class="banderas" id="banderas"></div>
</header>
<main>
  <div class="tabs">
    <button class="tab on" data-so="iphone">📱 iPhone</button>
    <button class="tab" data-so="android">🤖 Android</button>
  </div>

  <section class="caja" data-panel="iphone">
    <h2 data-t="en_iphone">En el iPhone</h2>
    <p class="video-tit" data-t="video">🎬 Míralo en vídeo (43 s)</p>
    <video class="video-inst" src="videos/instalar-iphone.mp4" poster="videos/instalar-iphone.jpg" controls playsinline preload="none"></video>
    <ol class="pasos">
      <li data-t="i1"></li>
      <li data-t="i2"></li>
      <li data-t="i3"></li>
      <li data-t="i4"></li>
      <li data-t="i5"></li>
    </ol>
  </section>

  <section class="caja" data-panel="android" hidden>
    <h2 data-t="en_android">En Android</h2>
    <p class="video-tit" data-t="video">🎬 Míralo en vídeo (43 s)</p>
    <video class="video-inst" src="videos/instalar-android.mp4" poster="videos/instalar-android.jpg" controls playsinline preload="none"></video>
    <ol class="pasos">
      <li data-t="a1"></li>
      <li data-t="a2"></li>
      <li data-t="a3"></li>
      <li data-t="a4"></li>
      <li data-t="a5"></li>
    </ol>
  </section>

  <section class="caja">
    <h2 data-t="abrir_tit">Abrir la app</h2>
    <a class="boton" href="./" data-t="abrir_btn">🪁 Abrir Canelo Wind</a>
    <div class="enlace">
      <input id="url" readonly value="https://canelowind.com/">
      <button id="copiar" data-t="copiar">Copiar</button>
    </div>
    <p class="nota" style="margin-bottom:0" data-t="copiar_nota">Copia este enlace para pasárselo a quien quieras.</p>
  </section>

  <section class="caja">
    <h2 data-t="saber_tit">Bueno saber</h2>
    <ul class="lista">
      <li data-t="s1"></li>
      <li data-t="s2"></li>
      <li data-t="s3"></li>
      <li data-t="s4"></li>
      <li data-t="s5"></li>
    </ul>
  </section>
</main>
<script>
// Textos de esta página en los 5 idiomas de la app (pueden llevar iconos en HTML)
const ICO_COMPARTIR = '<span class="icono">⬆️</span>', ICO_MAS = '<span class="icono">➕</span>', ICO_MENU = '<span class="icono">⋮</span>';
const IDIOMAS = [["es", "🇪🇸", "ES"], ["en", "🇬🇧", "EN"], ["de", "🇩🇪", "DE"], ["fr", "🇫🇷", "FR"], ["it", "🇮🇹", "IT"]];
const T = {
  es: {

    i3: `<b>Pulsa «Añadir a pantalla de inicio»</b>Baja un poco en la lista hasta verlo ${ICO_MAS}. Si no aparece, baja del todo, pulsa «Editar acciones…» y actívalo.`,

  },

    en_iphone: "On iPhone", en_android: "On Android",
    i1: "<b>Open the app in Safari</b>It must be Safari (the blue compass), not Chrome, Instagram or WhatsApp. If you got the link on WhatsApp, tap the three dots or the share button and choose «Open in Safari».",

    i1: "<b>Öffne die App in Safari</b>Es muss Safari sein (der blaue Kompass), nicht Chrome, Instagram oder WhatsApp. Wenn du den Link per WhatsApp bekommen hast, tippe auf die drei Punkte oder auf Teilen und wähle «In Safari öffnen».",
    i2: `<b>Tippe auf Teilen</b>Das ist das Quadrat mit dem Pfeil nach oben ${ICO_SHARE()}, unten in der Mitte des Bildschirms (bei manchen iPhones oben rechts).`,
    i3: `<b>Tippe auf «Zum Home-Bildschirm»</b>Scroll in der Liste etwas nach unten, bis du es siehst ${ICO_MAS}. Wenn es fehlt, scroll ganz nach unten, tippe auf «Aktionen bearbeiten…» und aktiviere es.`,

    i5: "<b>Fertig!</b>Auf deinem Home-Bildschirm hast du das zimtfarbene Symbol mit der Welle. Es öffnet sich wie jede andere App.",
    a1: "<b>Öffne die App in Chrome</b>Wenn du den Link per WhatsApp bekommen hast, tippe auf die drei Punkte und wähle «In Chrome öffnen».",
    a2: `<b>Tippe auf das Menü</b>Die drei Punkte ${ICO_MENU} oben rechts.`,
    a3: "<b>Tippe auf «App installieren» oder «Zum Startbildschirm hinzufügen»</b>Je nach Handy erscheint das eine oder das andere; beides funktioniert.",
    a4: "<b>Bestätige mit «Installieren» oder «Hinzufügen»</b>",
    a5: "<b>Fertig!</b>Das Symbol von Canelo Wind erscheint auf deinem Startbildschirm oder bei deinen Apps.",
    abrir_tit: "App öffnen", abrir_btn: "🪁 Canelo Wind öffnen", copiar: "Kopieren", copiado: "Kopiert!",
    copiar_nota: "Kopiere diesen Link, um ihn mit wem du willst zu teilen.",
    saber_tit: "Gut zu wissen",
    s1: "Sie ist kostenlos und du brauchst kein Konto.", s2: "Sie aktualisiert sich selbst: beim Öffnen hast du immer die neueste Version.",
    s3: "Sie braucht Internet, um die Vorhersage zu laden.", s4: "Wenn du auf dem Wasser bist, schick deinen Bericht vom Spot: so wird die App für alle besser. 🤙",
    s5: "Ideen oder fehlt ein Spot? Nutze den 💡-Knopf in der App.",
  },
  fr: {
    video: "🎬 Regarde la vidéo (en espagnol, 43 s)",
    titulo: "Installer Canelo Wind", sub: "L'appli sur ton mobile en 1 minute. Gratuite, sans App Store.",
    en_iphone: "Sur iPhone", en_android: "Sur Android",
    i1: "<b>Ouvre l'appli dans Safari</b>Ce doit être Safari (la boussole bleue), pas Chrome, Instagram ou WhatsApp. Si tu as reçu le lien par WhatsApp, touche les trois points ou le bouton de partage et choisis «Ouvrir dans Safari».",
    i2: `<b>Touche le bouton de partage</b>C'est le carré avec une flèche vers le haut ${ICO_SHARE()}, en bas au centre de l'écran (sur certains iPhone, en haut à droite).`,
    i3: `<b>Touche «Sur l'écran d'accueil»</b>Descends un peu dans la liste jusqu'à le voir ${ICO_MAS}. S'il n'apparaît pas, descends tout en bas, touche «Modifier les actions…» et active-le.`,
    i4: "<b>Touche «Ajouter»</b>En haut à droite. Garde le nom «Canelo Wind».",
    i5: "<b>C'est fait !</b>Sur ton écran d'accueil tu as l'icône couleur cannelle avec la vague. Elle s'ouvre comme n'importe quelle appli.",
    a1: "<b>Ouvre l'appli dans Chrome</b>Si tu as reçu le lien par WhatsApp, touche les trois points et choisis «Ouvrir dans Chrome».",
    a2: `<b>Touche le menu</b>Les trois points ${ICO_MENU} en haut à droite.`,
    a3: "<b>Touche «Installer l'application» ou «Ajouter à l'écran d'accueil»</b>Selon le téléphone, c'est l'un ou l'autre ; les deux marchent.",
    a4: "<b>Confirme avec «Installer» ou «Ajouter»</b>",
    a5: "<b>C'est fait !</b>L'icône de Canelo Wind apparaît sur ton écran d'accueil ou parmi tes applis.",
    abrir_tit: "Ouvrir l'appli", abrir_btn: "🪁 Ouvrir Canelo Wind", copiar: "Copier", copiado: "Copié !",
    copiar_nota: "Copie ce lien pour le partager avec qui tu veux.",
    saber_tit: "Bon à savoir",
    s1: "C'est gratuit et il ne faut pas de compte.", s2: "Elle se met à jour toute seule : à l'ouverture tu as toujours la dernière version.",
    s3: "Il faut internet pour charger les prévisions.", s4: "Si tu es sur l'eau, envoie ton rapport depuis le spot : l'appli s'améliore pour tout le monde. 🤙",
    s5: "Des idées ou il manque un spot ? Utilise le bouton 💡 de l'appli.",
  },
  it: {
    video: "🎬 Guarda il video (in spagnolo, 43 s)",
    titulo: "Installa Canelo Wind", sub: "L'app sul tuo telefono in 1 minuto. Gratis, senza App Store.",
    en_iphone: "Su iPhone", en_android: "Su Android",
    i1: "<b>Apri l'app in Safari</b>Deve essere Safari (la bussola blu), non Chrome, Instagram o WhatsApp. Se hai ricevuto il link su WhatsApp, tocca i tre puntini o il tasto condividi e scegli «Apri in Safari».",
    i2: `<b>Tocca il tasto condividi</b>È il quadrato con la freccia verso l'alto ${ICO_SHARE()}, in basso al centro dello schermo (su alcuni iPhone è in alto a destra).`,
    i3: `<b>Tocca «Aggiungi alla schermata Home»</b>Scorri un po' l'elenco finché lo vedi ${ICO_MAS}. Se non c'è, scorri fino in fondo, tocca «Modifica azioni…» e attivalo.`,
    i4: "<b>Tocca «Aggiungi»</b>In alto a destra. Lascia il nome «Canelo Wind».",

    a1: "<b>Apri l'app in Chrome</b>Se hai ricevuto il link su WhatsApp, tocca i tre puntini e scegli «Apri in Chrome».",
    a2: `<b>Tocca il menu</b>I tre puntini ${ICO_MENU} in alto a destra.`,
    a3: "<b>Tocca «Installa app» o «Aggiungi a schermata Home»</b>A seconda del telefono compare l'uno o l'altro; vanno bene tutti e due.",
    a4: "<b>Conferma con «Installa» o «Aggiungi»</b>",
    a5: "<b>Fatto!</b>L'icona di Canelo Wind compare nella schermata Home o tra le tue app.",
    abrir_tit: "Apri l'app", abrir_btn: "🪁 Apri Canelo Wind", copiar: "Copia", copiado: "Copiato!",
    copiar_nota: "Copia questo link per mandarlo a chi vuoi.",
    saber_tit: "Buono a sapersi",
    s1: "È gratis e non serve un account.", s2: "Si aggiorna da sola: quando la apri hai sempre l'ultima versione.",
    s3: "Serve internet per caricare le previsioni.", s4: "Se sei in acqua, manda la tua segnalazione dallo spot: così l'app migliora per tutti. 🤙",
    s5: "Idee o manca uno spot? Usa il tasto 💡 dell'app.",
  },
};
function ICO_SHARE() { return ICO_COMPARTIR; }

// Idioma: el elegido en la app (se guarda en este navegador); si no, el del móvil
const leerIdioma = () => { try { const v = localStorage.getItem("cw_idioma"); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
let idioma = leerIdioma() || (navigator.language || "es").slice(0, 2).toLowerCase();
if (!T[idioma]) idioma = "es";

function pintar() {
  const tx = T[idioma];
  document.documentElement.lang = idioma;
  document.title = tx.titulo;
  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = tx[e.dataset.t]; });
  document.getElementById("banderas").innerHTML = IDIOMAS.map(([c, b, n]) => `<button data-i="${c}" class="${c === idioma ? "on" : ""}">${b} ${n}</button>`).join("");
  document.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    idioma = b.dataset.i;
    try { localStorage.setItem("cw_idioma", JSON.stringify(idioma)); } catch (e) {}
    pintar();
  });
}
pintar();

const ponerSO = (so) => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.so === so));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== so);
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => ponerSO(t.dataset.so));
if (/android/i.test(navigator.userAgent)) ponerSO("android");
document.getElementById("copiar").onclick = async (e) => {
  const url = document.getElementById("url");
  try { await navigator.clipboard.writeText(url.value); } catch (err) { url.select(); document.execCommand("copy"); }
  e.target.textContent = T[idioma].copiado;
  setTimeout(() => e.target.textContent = T[idioma].copiar, 2000);
};
</script>
</body>
</html>
